<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DesImageEditor</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/app.css">
</head>
<body>
  <header>
    <h1>DesImageEditor</h1>
    <p class="subtitle">Add real-world camera imperfections and compression artifacts to your images. Everything runs locally — no upload, no server, no paywall.</p>
  </header>

  <main>
    <!-- Upload Zone -->
    <section id="upload-section">
      <div id="drop-zone">
        <div class="drop-content">
          <p>Drop a JPEG here or <strong>click to browse</strong></p>
        </div>
        <input type="file" id="file-input" accept="image/jpeg" hidden>
      </div>
      <p id="error-msg" class="error hidden"></p>
    </section>

    <!-- Zoom overlay (hidden until output clicked) -->
    <div id="zoom-overlay" class="hidden">
      <div class="zoom-close">&times;</div>
      <img id="zoom-image" src="" alt="Full resolution output">
    </div>

    <!-- Workspace (hidden until image loaded) -->
    <section id="workspace" class="hidden">
      <div class="workspace-layout">
        <!-- Input Panel -->
        <div class="panel">
          <h2>Input</h2>
          <div id="input-canvas-container" class="canvas-container">
            <canvas id="input-canvas"></canvas>
          </div>
          <p id="image-info" class="info-text"></p>
        </div>

        <!-- Controls Panel -->
        <div class="panel controls-panel">
          <h2>Region</h2>

          <div class="control-group">
            <label for="region-left">Left offset</label>
            <input type="number" id="region-left" value="0" min="0">
          </div>
          <div class="control-group">
            <label for="region-top">Top offset</label>
            <input type="number" id="region-top" value="0" min="0">
          </div>
          <div class="control-group">
            <label for="region-width">Width</label>
            <input type="number" id="region-width" value="200" min="1">
          </div>
          <div class="control-group">
            <label for="region-height">Height</label>
            <input type="number" id="region-height" value="200" min="1">
          </div>

          <div class="effects-divider"></div>
          <h2>Effects</h2>
          <div id="effects-list"></div>

          <button id="apply-btn" class="btn-primary">Apply effects</button>
          <button id="reset-btn" class="btn-secondary">Reset all</button>
          <p id="status-msg" class="info-text"></p>
        </div>

        <!-- Output Panel -->
        <div class="panel">
          <h2>Output</h2>
          <div class="canvas-container">
            <canvas id="output-canvas"></canvas>
          </div>
          <div class="output-actions">
            <span id="output-size"></span>
            <button id="download-btn" class="btn-primary" disabled>Download</button>
          </div>
        </div>
      </div>
    </section>
  </main>

  <footer>
    <p>Processing is entirely local. No image ever leaves your browser.</p>
  </footer>

  <script type="module" src="js/app.js"></script>
</body>
</html>
